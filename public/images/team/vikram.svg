<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0ac69"/>
      <stop offset="100%" stop-color="#c68642"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Glowing halo -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#neon)" stroke-width="3" opacity="0.6"/>

  <!-- Body / Hoodie -->
  <path d="M 80 480 L 110 330 C 130 300, 270 300, 290 330 L 320 480 Z" fill="url(#suit)"/>

  <!-- Neck -->
  <rect x="180" y="240" width="40" height="70" rx="10" fill="url(#skin)"/>

  <!-- Face -->
  <path d="M 140 150 C 140 250, 260 250, 260 150 C 260 100, 140 100, 140 150 Z" fill="url(#skin)"/>

  <!-- Beard -->
  <path d="M 145 180 C 145 255, 255 255, 255 180 C 255 230, 145 230, 145 180 Z" fill="#022c22" opacity="0.7"/>

  <!-- Short Hair -->
  <path d="M 138 140 C 138 75, 262 75, 262 140 C 240 95, 160 95, 138 140 Z" fill="#064e3b"/>

  <!-- Eyes -->
  <circle cx="170" cy="158" r="5" fill="#0f172a"/>
  <circle cx="230" cy="158" r="5" fill="#0f172a"/>

  <!-- Smile -->
  <path d="M 180 205 Q 200 218 220 205" fill="none" stroke="#022c22" stroke-width="3" stroke-linecap="round"/>

  <!-- Badge -->
  <g transform="translate(130, 390)">
    <rect width="140" height="30" rx="15" fill="url(#neon)" opacity="0.9"/>
    <text x="70" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DEVOPS LEAD ⚙️</text>
  </g>
</svg>
