<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9"/>
      <stop offset="100%" stop-color="#e5b584"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Glowing halo -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#neon)" stroke-width="3" opacity="0.6"/>
  <circle cx="200" cy="180" r="150" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Body / Shoulders -->
  <path d="M 80 480 L 110 330 C 130 300, 270 300, 290 330 L 320 480 Z" fill="url(#suit)"/>
  <!-- Inner shirt & tie outline -->
  <path d="M 175 320 L 200 370 L 225 320 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 195 320 L 200 440 L 205 320 Z" fill="#3b82f6"/>

  <!-- Neck -->
  <rect x="180" y="240" width="40" height="70" rx="10" fill="url(#skin)"/>

  <!-- Face -->
  <path d="M 140 150 C 140 250, 260 250, 260 150 C 260 100, 140 100, 140 150 Z" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M 135 150 C 130 90, 170 60, 200 60 C 240 60, 270 90, 265 150 C 255 110, 230 85, 200 85 C 170 85, 145 110, 135 150 Z" fill="#1e1b4b"/>

  <!-- Tech Glasses -->
  <rect x="150" y="145" width="42" height="26" rx="6" fill="none" stroke="#60a5fa" stroke-width="3.5"/>
  <rect x="208" y="145" width="42" height="26" rx="6" fill="none" stroke="#60a5fa" stroke-width="3.5"/>
  <line x1="192" y1="158" x2="208" y2="158" stroke="#60a5fa" stroke-width="3.5"/>

  <!-- Eyes -->
  <circle cx="171" cy="158" r="4" fill="#1e293b"/>
  <circle cx="229" cy="158" r="4" fill="#1e293b"/>

  <!-- Smile -->
  <path d="M 180 205 Q 200 220 220 205" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>

  <!-- Tech Badges -->
  <g transform="translate(130, 390)">
    <rect width="140" height="30" rx="15" fill="url(#neon)" opacity="0.9"/>
    <text x="70" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TECH LEAD ⚡</text>
  </g>
</svg>
