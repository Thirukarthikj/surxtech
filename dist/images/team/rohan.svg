<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9"/>
      <stop offset="100%" stop-color="#d99b66"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Glowing halo -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#neon)" stroke-width="3" opacity="0.6"/>

  <!-- Body / Jacket -->
  <path d="M 80 480 L 110 330 C 130 300, 270 300, 290 330 L 320 480 Z" fill="url(#suit)"/>

  <!-- Neck -->
  <rect x="180" y="240" width="40" height="70" rx="10" fill="url(#skin)"/>

  <!-- Headphones on neck -->
  <path d="M 130 250 C 130 310, 270 310, 270 250" fill="none" stroke="#d97706" stroke-width="18" stroke-linecap="round"/>
  <rect x="120" y="235" width="25" height="35" rx="8" fill="#1e293b"/>
  <rect x="255" y="235" width="25" height="35" rx="8" fill="#1e293b"/>

  <!-- Face -->
  <path d="M 140 150 C 140 250, 260 250, 260 150 C 260 100, 140 100, 140 150 Z" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M 135 140 C 135 70, 265 70, 265 140 C 240 80, 160 80, 135 140 Z" fill="#451a03"/>

  <!-- Eyes -->
  <circle cx="170" cy="158" r="5" fill="#1e293b"/>
  <circle cx="230" cy="158" r="5" fill="#1e293b"/>

  <!-- Smile -->
  <path d="M 180 205 Q 200 220 220 205" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

  <!-- Badge -->
  <g transform="translate(130, 390)">
    <rect width="140" height="30" rx="15" fill="url(#neon)" opacity="0.9"/>
    <text x="70" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MEDIA LEAD 🎬</text>
  </g>
</svg>
